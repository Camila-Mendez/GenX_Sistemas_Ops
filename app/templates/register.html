{% extends "layout.html" %}
{% block title %}Register Shopper{% endblock %}

{% block content %}
<h1>Register as Shopper</h1>

<div class="form-card">
  <form method="POST">
    <div class="form-field">
      <label>Nombre de usuario</label>
      <input type="text" name="username" required>
    </div>
    <div class="form-field">
      <label>Contraseña</label>
      <input type="password" name="password" required>
    </div>

    <button class="btn" type="submit">Registrar</button>
  </form>

  {% if error %}
    <p style="color:red;margin-top:8px;">{{ error }}</p>
  {% endif %}
</div>

<p style="margin-top:12px">Si necesitás una cuenta User (acceso a dashboard), contactá a <b>sales@lacarretadelcafe.com</b></p>
{% endblock %}
