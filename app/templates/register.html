{% extends "layout.html" %}
{% block title %}Crear cuenta · GenX{% endblock %}

{% block content %}
<div class="auth">
  <div class="card form auth-card">
    <span class="eyebrow">Registro de clientes</span>
    <h1>Crear cuenta</h1>
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-row">
        <label class="field"><span>Nombre completo *</span><input type="text" name="full_name" value="{{ form.full_name }}" required></label>
        <label class="field"><span>Empresa</span><input type="text" name="company" value="{{ form.company }}"></label>
      </div>
      <div class="form-row">
        <label class="field"><span>Usuario *</span><input type="text" name="username" value="{{ form.username }}" maxlength="50" autocomplete="username" required></label>
        <label class="field"><span>Correo *</span><input type="email" name="email" value="{{ form.email }}" required></label>
      </div>
      <div class="form-row">
        <label class="field"><span>Contraseña * <small>(mín. 8)</small></span><input type="password" name="password" minlength="8" autocomplete="new-password" required></label>
        <label class="field"><span>Confirmar contraseña *</span><input type="password" name="password_confirm" minlength="8" autocomplete="new-password" required></label>
      </div>
      <button class="btn" type="submit">Crear cuenta</button>
    </form>
    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
  </div>
</div>
{% endblock %}
