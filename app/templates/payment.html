{% extends "layout.html" %}
{% block title %}Pago — La Carreta del Café {% endblock %}
{% block content %}
<h1>Pago</h1>

<p>Total a pagar: <strong>${{ order.total }}</strong></p>

<form method="post">
  <label>Número de tarjeta</label>
  <input type="text" placeholder="4242 4242 4242 4242" required>

  <label>Fecha de expiración</label>
  <input type="text" placeholder="MM/YY" required>

  <label>CVV</label>
  <input type="text" placeholder="123" required>

  <button class="btn">Pagar ahora</button>
</form>
{% endblock %}
